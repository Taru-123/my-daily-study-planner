<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>My Daily Planner 📚</h1>
    <p class="subtitle">Plan Today, Achieve Tomorrow ✨</p>

    <div class="date-box">
        <span>📅 Today is</span>
        <h3 id="todayDate"></h3>
    </div>

    <div class="input-box">
        <input type="text" id="taskInput"
        placeholder="Write your task...">
        <button onclick="addTask()">+ Add Task</button>
    </div>

    <div class="progress">
        <div>✅ Completed<br>
            <span id="completedCount">0</span>
        </div>
        <div>⏰ Pending<br>
            <span id="pendingCount">0</span>
        </div>
    </div>

    <h3 class="task-heading">📋 Your Tasks</h3>

    <ul id="taskList"></ul>

    <button class="clear-btn" onclick="clearCompleted()">
        Clear Completed
    </button>

    <p class="footer">
        ✨ Stay Focused. Stay Consistent. Success is Yours! 💜
    </p>

</div>

<script src="script.js"></script>
</body>
</html>
